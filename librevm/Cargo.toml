[package]
name = "revmapi"
version = "0.0.1"
edition = "2021"
rust-version = "1.81.0"
publish = false
description = "Revm Engine FFI API"
repository = "https://github.com/0xEyrie/revmffi"
exclude = [".gitignore"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
serde = []
# This feature requires Rust nightly because it depends on the unstable backtrace feature.
backtraces = []

[dependencies]
errno = "0.3.0"
bytes = "1.4.0"
serde = { version = "1.0.188", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0.94"
thiserror = "1.0.34"
alloy-primitives = { version = "0.8.2", default-features = true }
revm = { version = "19.0", default-features = false }
revmc = { git = "https://github.com/0xEyrie/revmc" }
revmc-worker = { git = "https://github.com/0xEyrie/revmc" }
color-eyre = "0.6"
tokio = { version = "1.41.1", features = ["full"] }
once_cell = "1.20.2"
libloading = "0.8"
sled = "0.34.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-appender = "0.2.3"
chrono = "0.4.38"
chrono-tz = "0.10.0"
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
cbindgen = "0.26.0"
prost-build = "0.13.4"
