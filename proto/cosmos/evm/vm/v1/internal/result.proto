syntax = "proto3";

option go_package = "github.com/cosmos/evm/x/vm/types";
package cosmos.evm.vm.v1.internal;

// Internal types for EVM execution results (revmc/revmffi integration)
// Use raw bytes for efficiency, unlike v1 types which use hex strings for external API

// InternalHaltReasonEnum defines all possible reasons for EVM execution halt (failure).
// These correspond to revm's HaltReason enum and represent various error conditions.
enum InternalHaltReasonEnum {
  HALT_REASON_ENUM_UNSPECIFIED_UNSPECIFIED = 0; // Unspecified halt reason
  HALT_REASON_ENUM_OUT_OF_GAS_BASIC = 1; // Basic out of gas error
  HALT_REASON_ENUM_OUT_OF_GAS_MEMORY_LIMIT = 2; // Memory limit reached
  HALT_REASON_ENUM_OUT_OF_GAS_MEMORY = 3; // Out of gas during memory expansion
  HALT_REASON_ENUM_OUT_OF_GAS_PRECOMPILE = 4; // Precompile consumed more gas than available
  HALT_REASON_ENUM_OUT_OF_GAS_INVALID_OPERAND = 5; // Invalid operand consumed gas
  HALT_REASON_ENUM_OUT_OF_GAS_REENTRANCY_SENTRY = 6; // Reentrancy guard consumed gas
  HALT_REASON_ENUM_OPCODE_NOT_FOUND = 7; // Encountered unknown opcode
  HALT_REASON_ENUM_INVALID_FE_OPCODE = 8; // Invalid 0xFE opcode
  HALT_REASON_ENUM_INVALID_JUMP = 9; // JUMP/JUMPI to invalid destination
  HALT_REASON_ENUM_NOT_ACTIVATED = 10; // Feature not activated for current fork
  HALT_REASON_ENUM_STACK_UNDERFLOW = 11; // Stack underflow
  HALT_REASON_ENUM_STACK_OVERFLOW = 12; // Stack overflow (>1024 items)
  HALT_REASON_ENUM_OUT_OF_OFFSET = 13; // Memory access out of bounds
  HALT_REASON_ENUM_CREATE_COLLISION = 14; // CREATE collision with existing contract
  HALT_REASON_ENUM_PRECOMPILE_ERROR = 15; // Precompile execution error
  HALT_REASON_ENUM_NONCE_OVERFLOW = 16; // Account nonce overflow
  HALT_REASON_ENUM_CREATE_CONTRACT_SIZE_LIMIT = 17; // Contract size exceeds limit (24KB)
  HALT_REASON_ENUM_CREATE_CONTRACT_STARTING_WITH_EF = 18; // Contract code starts with 0xEF (EOF)
  HALT_REASON_ENUM_CREATE_INIT_CODE_SIZE_LIMIT = 19; // Init code exceeds size limit
  HALT_REASON_ENUM_OVERFLOW_PAYMENT = 20; // Payment amount overflow
  HALT_REASON_ENUM_STATE_CHANGE_DURING_STATIC_CALL = 21; // State modification in STATICCALL
  HALT_REASON_ENUM_CALL_NOT_ALLOWED_INSIDE_STATIC = 22; // Non-static call inside STATICCALL
  HALT_REASON_ENUM_OUT_OF_FUNDS = 23; // Insufficient balance for transfer
  HALT_REASON_ENUM_CALL_TOO_DEEP = 24; // Call depth exceeds 1024
  HALT_REASON_ENUM_EOF_FUNCTION_STACK_OVERFLOW = 25; // EOF function stack overflow
  HALT_REASON_ENUM_INVALID_EXTCALL_TARGET = 26; // Invalid EXTCALL target
  HALT_REASON_ENUM_EOF_AUX_DATA_OVERFLOW = 27; // EOF auxiliary data overflow
  HALT_REASON_ENUM_EOF_AUX_DATA_TOO_SMALL = 28; // EOF auxiliary data too small
}

// InternalSuccessReasonEnum defines reasons for successful EVM execution.
// Corresponds to revm's SuccessReason enum.
enum InternalSuccessReasonEnum {
  SUCCESS_REASON_ENUM_UNSPECIFIED = 0; // Unspecified success
  SUCCESS_REASON_ENUM_STOP = 1; // STOP opcode executed
  SUCCESS_REASON_ENUM_RETURN = 2; // RETURN opcode executed
  SUCCESS_REASON_ENUM_SELF_DESTRUCT = 3; // SELFDESTRUCT opcode executed
  SUCCESS_REASON_ENUM_EOF_RETURN_CONTRACT = 4; // EOF RETURNCONTRACT executed
}

// InternalTopic represents a 32-byte event log topic.
// Topics are indexed parameters in Solidity events used for efficient filtering.
message InternalTopic {
  bytes value = 1; // 32 bytes - keccak256 hash of event signature or indexed parameter
}

// InternalLogData contains the topics and data for a log entry.
message InternalLogData {
  repeated InternalTopic topics = 1; // Up to 4 topics per log (topic[0] is event signature)
  bytes data = 2; // Non-indexed event parameters (ABI-encoded)
}

// InternalLog represents an EVM event log entry generated by the LOG0-LOG4 opcodes.
// Corresponds to an Ethereum log entry.
message InternalLog {
  bytes address = 1; // 20 bytes - Contract address that emitted the log
  InternalLogData data = 2; // Log topics and data
}

// InternalCall represents the output of a CALL-type operation.
message InternalCall {
  bytes call = 1; // Return data from the call (variable length)
}

// InternalCreate represents the output of a CREATE/CREATE2 operation.
message InternalCreate {
  bytes create = 1; // Return data from constructor (typically empty)
  bytes created_address = 2; // 20 bytes - Address of the newly created contract
}

// InternalOutput is a union type representing the output of an EVM execution.
message InternalOutput {
  oneof output {
    InternalCall call = 1; // Output from CALL/CALLCODE/DELEGATECALL/STATICCALL
    InternalCreate create = 2; // Output from CREATE/CREATE2
  }
}

// InternalSuccess represents a successful EVM execution result.
message InternalSuccess {
  InternalSuccessReasonEnum reason = 1; // Why execution succeeded
  uint64 gas_used = 2; // Gas consumed during execution
  uint64 gas_refunded = 3; // Gas refunded (e.g., from SSTORE clearing)
  repeated InternalLog logs = 4; // Event logs emitted during execution
  InternalOutput output = 5; // Return data from the execution
}

// InternalRevert represents a reverted EVM execution (REVERT opcode).
// Reverts undo all state changes but consume gas and can return data.
message InternalRevert {
  uint64 gas_used = 1; // Gas consumed before revert
  bytes output = 2; // Revert reason/message returned by REVERT opcode
}

// InternalHalt represents a halted (failed) EVM execution.
// Halts consume all provided gas and return no data.
message InternalHalt {
  InternalHaltReasonEnum reason = 1; // Specific reason for halt
  uint64 gas_used = 2; // Gas consumed (typically all provided gas)
}

// InternalError represents an unexpected error during EVM execution.
// This is for errors in the execution environment, not EVM-level failures.
message InternalError {
  string message = 1; // Error message describing what went wrong
}

// InternalEvmResult is the top-level result of an EVM transaction execution.
// Only one of the result variants will be set.
message InternalEvmResult {
  oneof result {
    InternalSuccess success = 1; // Successful execution
    InternalRevert revert = 2; // Execution reverted
    InternalHalt halt = 3; // Execution halted with error
    InternalError error = 4; // Environment error
  }
}
